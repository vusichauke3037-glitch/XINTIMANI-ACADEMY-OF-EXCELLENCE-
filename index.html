<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xintimani V9</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style> *{box-sizing:border-box;margin:0;padding:0;font-family:Arial} #loginPage{position:fixed;inset:0;background:#0b2a4a;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px} .loginBox{background:#fff;padding:24px;border-radius:16px;width:100%;max-width:360px;text-align:center} input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px} .btn{width:100%;padding:12px;background:#0b2a4a;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px} header{background:#0b2a4a;color:#fff;padding:12px;display:flex;gap:10px;align-items:center} section{padding:12px;display:none} section.active{display:block} .box{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px} table{width:100%;font-size:11px;border-collapse:collapse} th,td{padding:6px;border-bottom:1px solid #eee} nav{display:flex;gap:6px;padding:8px;flex-wrap:wrap} nav button{padding:6px 12px;border-radius:20px;border:none;background:#ddd} nav button.active{background:#0b2a4a;color:#fff} </style></head><body>
<div id="loginPage"><div class="loginBox"><img src="logo.png" style="width:70px;height:70px;border-radius:50%;border:2px solid #0b2a4a"><h2>Xintimani V9</h2><p style="font-size:12px;color:green">● CLOUD SYNC READY</p><input id="loginUser" value="coordinator"><input type="password" id="loginPass" value="Xintimani2026"><button class="btn" onclick="doLogin()">Login</button><p style="font-size:10px;margin-top:8px">coordinator / Xintimani2026<br>educator / educator123</p><p id="loginError" style="color:red;font-size:12px"></p></div></div>
<div id="app" style="display:none"><header><img src="logo.png" style="width:36px;height:36px;background:#fff;border-radius:50%"><div><b>Xintimani V9 LIVE</b><br><small id="welcomeUser"></small></div><button class="btn" style="width:auto;margin-left:auto;background:#b42318;padding:8px 12px" onclick="doLogout()">Logout</button></header>
<div style="padding:8px;background:#e8f5e9;font-size:11px" id="syncStatus">● Connected to cloud - All devices sync</div>
<nav><button class="active" onclick="showTab('issue',this)">Issue</button><button onclick="showTab('books',this)">Books</button><button onclick="showTab('learners',this)">Learners</button><button onclick="showTab('history',this)">History</button><button onclick="showTab('settings',this)">Settings</button></nav>
<section id="issue" class="active"><div class="box"><h3>Issue Book</h3><select id="issueLearner"></select><select id="issueBook"></select><select id="issueCopy"></select><input type="date" id="issueDate"><input type="date" id="dueDate"><button class="btn" onclick="issueBook()">Issue</button></div><div class="box"><h3>Return</h3><input id="searchReturn" placeholder="Search textbook number" onkeyup="renderIssued()"><table><thead><tr><th>Copy</th><th>Learner</th><th>Book</th><th></th></tr></thead><tbody id="issuedList"></tbody></table></div></section>
<section id="books"><div class="box"><h3>Add Book</h3><input id="bTitle" placeholder="Title"><input id="bSubject" placeholder="Subject"><input id="bQty" type="number" placeholder="Qty"><input id="bCode" placeholder="Base Code e.g. PLATINUM"><textarea id="bNumbers" placeholder="Optional comma list"></textarea><button class="btn" onclick="addBook()">Add to Cloud</button></div><div class="box"><h3>Import Excel/CSV to Cloud</h3><input type="file" id="bulkFile" accept=".xlsx,.xls,.csv"><button class="btn" style="background:#d67e00" onclick="importBulk()">Import</button><p id="importStatus"></p></div><div class="box"><table><thead><tr><th>CopyNo</th><th>Title</th><th>Status</th><th>Learner</th></tr></thead><tbody id="bookList"></tbody></table></div></section>
<section id="learners"><div class="box"><input id="lName" placeholder="Name"><input id="lGrade" placeholder="Class"><input id="lId" placeholder="Admission No"><button class="btn" onclick="addLearner()">Add Learner to Cloud</button><table><tbody id="learnerList"></tbody></table></div></section>
<section id="history"><div class="box"><button class="btn" style="background:#1a7a3a" onclick="exportCSV()">Export CSV</button><table><tbody id="historyList"></tbody></table></div></section>
<section id="settings"><div class="box"><h3>Migrate Old V8.1 Data</h3><button class="btn" style="background:#1a7a3a" onclick="migrateLocalToCloud()">Click ONCE to Upload Old Data to Cloud</button><p id="migrateStatus"></p></div></section></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBOO3N0FFOIYj3QAwqM1HEIDlu9zZLLVHQ", authDomain: "xintimani-academy.firebaseapp.com", projectId: "xintimani-academy", storageBucket: "xintimani-academy.firebasestorage.app", messagingSenderId: "149830775344", appId: "1:149830775344:web:2758c500bc1bbd4099f3f5" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let users = JSON.parse(localStorage.getItem('xb_users')||'[{"username":"coordinator","password":"Xintimani2026","role":"coordinator"},{"username":"educator","password":"educator123","role":"educator"}]');
let books=[], learners=[], transactions=[], currentUser=JSON.parse(localStorage.getItem('xb_current_user')||'null');
document.getElementById('issueDate').valueAsDate=new Date(); let d=new Date(); d.setDate(d.getDate()+14); document.getElementById('dueDate').valueAsDate=d;
if(currentUser) showApp();
window.doLogin=function(){ let u=document.getElementById('loginUser').value.trim(); let p=document.getElementById('loginPass').value; let f=users.find(x=>x.username===u && x.password===p); if(f){currentUser=f; localStorage.setItem('xb_current_user',JSON.stringify(f)); showApp();} else document.getElementById('loginError').innerText='Wrong password';}
window.doLogout=function(){ localStorage.removeItem('xb_current_user'); location.reload(); }
window.showApp=function(){ document.getElementById('loginPage').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('welcomeUser').innerText='Welcome '+currentUser.username; startSync(); }
function startSync(){ onSnapshot(collection(db,'books'), s=>{books=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll();}); onSnapshot(collection(db,'learners'), s=>{learners=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll();}); onSnapshot(collection(db,'transactions'), s=>{transactions=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll();});}
window.showTab=function(id,el){ document.querySelectorAll('section').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active')); if(el)el.classList.add('active');}
window.addLearner=async function(){ let n=document.getElementById('lName').value; if(!n) return; await addDoc(collection(db,'learners'),{name:n, grade:document.getElementById('lGrade').value, adm:document.getElementById('lId').value}); document.getElementById('lName').value=''; }
window.addBook=async function(){ let title=document.getElementById('bTitle').value; let qty=parseInt(document.getElementById('bQty').value)||0; let base=document.getElementById('bCode').value||title.substring(0,8).toUpperCase(); let nums=document.getElementById('bNumbers').value.trim(); let list=nums?nums.split(',').map(s=>s.trim()):[]; if(!list.length){ for(let i=1;i<=qty;i++) list.push(base+'-'+String(i).padStart(3,'0')); } let batch=writeBatch(db); let existing=new Set(books.map(b=>b.copyNo)); let c=0; for(let no of list){ if(existing.has(no)) continue; let ref=doc(collection(db,'books')); batch.set(ref,{copyNo:no,title:title,subject:document.getElementById('bSubject').value,status:'AVAILABLE',learner:null}); c++; } await batch.commit(); alert('Added '+c+' to cloud'); }
window.issueBook=async function(){ let l=learners.find(x=>x.fid==document.getElementById('issueLearner').value); let copy=books.find(x=>x.fid==document.getElementById('issueCopy').value); if(!l||!copy) return alert('Select'); await updateDoc(doc(db,'books',copy.fid),{status:'ISSUED',learner:l.name}); await addDoc(collection(db,'transactions'),{copyNo:copy.copyNo,title:copy.title,learner:l.name,issueDate:document.getElementById('issueDate').value,dueDate:document.getElementById('dueDate').value,status:'ISSUED'}); }
window.renderAll=function(){ document.getElementById('issueLearner').innerHTML=learners.map(l=>`<option value="${l.fid}">${l.name} - ${l.grade}</option>`).join(''); let titles=[...new Set(books.map(b=>b.title))]; document.getElementById('issueBook').innerHTML=titles.map(t=>`<option value="${t}">${t}</option>`).join(''); let selT=document.getElementById('issueBook').value; let avail=books.filter(b=>b.title==selT && b.status=='AVAILABLE'); document.getElementById('issueCopy').innerHTML=avail.map(b=>`<option value="${b.fid}">${b.copyNo}</option>`).join(''); document.getElementById('bookList').innerHTML=books.slice(-100).map(b=>`<tr><td>${b.copyNo}</td><td>${b.title}</td><td>${b.status}</td><td>${b.learner||''}</td></tr>`).join(''); document.getElementById('learnerList').innerHTML=learners.map(l=>`<tr><td>${l.name}</td><td>${l.grade}</td></tr>`).join(''); renderIssued(); }
window.renderIssued=function(){ let q=document.getElementById('searchReturn').value.toLowerCase(); let list=transactions.filter(t=>t.status=='ISSUED' && (!q || t.copyNo.toLowerCase().includes(q) || t.learner.toLowerCase().includes(q))); document.getElementById('issuedList').innerHTML=list.map(t=>`<tr><td>${t.copyNo}</td><td>${t.learner}</td><td>${t.title}</td><td><button onclick="returnBook('${t.fid}','${t.copyNo}')">Return</button></td></tr>`).join(''); document.getElementById('historyList').innerHTML=transactions.slice(-100).map(t=>`<tr><td>${t.copyNo} - ${t.title} - ${t.learner} - ${t.status}</td></tr>`).join(''); }
window.returnBook=async function(fid,copyNo){ let b=books.find(x=>x.copyNo==copyNo); if(b) await updateDoc(doc(db,'books',b.fid),{status:'AVAILABLE',learner:null}); await updateDoc(doc(db,'transactions',fid),{status:'RETURNED'}); }
window.migrateLocalToCloud=async function(){ let lb=JSON.parse(localStorage.getItem('xb_books')||'[]'); if(!lb.length) return alert('No V8.1 data found'); let batch=writeBatch(db); for(let b of lb){ let ref=doc(collection(db,'books')); batch.set(ref,{copyNo:b.copyNo,title:b.title,subject:b.subject||'',status:b.status||'AVAILABLE',learner:b.learner||null}); } await batch.commit(); document.getElementById('migrateStatus').innerText='Migrated '+lb.length+' books to cloud!'; }
window.importBulk=async function(){ alert('Use full V9 for Excel - this lite version supports manual add. Use migrate button for old data.'); }
window.exportCSV=function(){ let csv=transactions.map(t=>t.copyNo+','+t.title+','+t.learner).join('\\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv])); a.download='export.csv'; a.click(); }
document.getElementById('issueBook').addEventListener('change',renderAll);
</script></body></html>
