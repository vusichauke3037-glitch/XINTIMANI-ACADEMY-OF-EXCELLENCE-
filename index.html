<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xintimani V10.1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/29/29302.png">
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f4f6f9} #loginPage{position:fixed;inset:0;background:#0b2a4a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px} .loginBox{background:#fff;padding:24px;border-radius:16px;width:100%;max-width:380px;text-align:center} input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px} .btn{width:100%;padding:12px;background:#0b2a4a;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer} .btn.orange{background:#d67e00} .btn.green{background:#1a7a3a} .btn.red{background:#b42318} #app{display:none} header{background:#0b2a4a;color:#fff;padding:12px;display:flex;gap:10px;align-items:center} nav{display:flex;gap:6px;padding:8px;flex-wrap:wrap} nav button{padding:8px 12px;border:none;border-radius:20px;background:#ddd} nav button.active{background:#0b2a4a;color:#fff} section{padding:12px;display:none} section.active{display:block} .box{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px} table{width:100%;font-size:11px;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left} .syncBadge{background:#00a000;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px} .overdue{color:#b42318;font-weight:bold}</style></head><body>
<div id="loginPage"><div class="loginBox"><h2>Xintimani V10.1</h2><p style="font-size:11px;color:green"><span class="syncBadge">● INSTALLABLE APP</span></p><input id="loginUser" placeholder="Username" value="coordinator"><input type="password" id="loginPass" placeholder="Password" value="Xintimani2026"><button class="btn" onclick="doLogin()">Login</button><button class="btn orange" onclick="forceLogin()">🚨 EMERGENCY LOGIN</button><button class="btn" style="background:#ddd;color:#333" onclick="clearAll()">🧹 Clear Data</button><p id="loginError" style="color:red;font-size:12px;margin-top:8px"></p></div></div>
<div id="app"><header><div><b>Xintimani V10.1 <span class="syncBadge">LIVE</span></b><br><small id="welcomeUser"></small></div><button class="btn" style="width:auto;margin-left:auto;background:#b42318;padding:8px 12px" onclick="doLogout()">Logout</button></header>
<div style="padding:8px;background:#fff"><span id="roleInfo"></span> <small id="syncStatus" style="color:green">● Connected</small> <button id="installBtn" style="display:none;margin-left:10px;background:#0b2a4a;color:#fff;border:none;padding:6px 12px;border-radius:12px">📲 Install App</button></div>
<nav><button class="active" onclick="showTab('issue',this)">Issue</button><button onclick="showTab('books',this)">Books</button><button onclick="showTab('learners',this)">Learners</button><button onclick="showTab('history',this)">History</button><button onclick="showTab('settings',this)">Settings</button></nav>
<section id="issue" class="active"><div class="box"><h3>Issue Book</h3><select id="issueLearner"></select><select id="issueBook"></select><select id="issueCopy"></select><input type="date" id="issueDate"><input type="date" id="dueDate"><button class="btn" onclick="issueBook()">Issue</button></div><div class="box"><h3>Currently Issued <button class="btn red" style="width:auto;padding:6px 12px;font-size:11px" onclick="returnAll()">Return All</button></h3><input id="searchReturn" placeholder="Search" onkeyup="renderAll()"><table><thead><tr><th>Copy</th><th>Learner</th><th>Title</th><th>Due</th><th>Action</th></tr></thead><tbody id="issuedList"></tbody></table></div></section>
<section id="books"><div class="box"><h3>All Copies</h3><table><thead><tr><th>CopyNo</th><th>Title</th><th>Status</th><th>Learner</th><th>Condition</th></tr></thead><tbody id="bookList"></tbody></table></div></section>
<section id="learners"><div class="box"><input id="lName" placeholder="Name"><input id="lGrade" placeholder="Class"><input id="lId" placeholder="Adm No"><button class="btn" onclick="addLearner()">Add Learner</button></div><div class="box"><table><thead><tr><th>Name</th><th>Class</th></tr></thead><tbody id="learnerList"></tbody></table></div></section>
<section id="history"><div class="box"><h3>History <button class="btn green" style="width:auto;padding:6px 12px" onclick="exportCSV()">Export CSV</button></h3><table><thead><tr><th>Date</th><th>CopyNo</th><th>Title</th><th>Learner</th><th>Status</th><th>Cond</th></tr></thead><tbody id="historyList"></tbody></table></div></section>
<section id="settings"><div class="box"><h3>Educator Management</h3><input id="eName" placeholder="Full Name"><input id="eUsername" placeholder="Username"><input id="ePassword" placeholder="Password"><button class="btn orange" onclick="addEducator()">Add Educator to Cloud</button><p id="eduMsg" style="color:green;font-size:12px"></p><table style="margin-top:10px"><thead><tr><th>Name</th><th>Username</th><th>Password</th></tr></thead><tbody id="educatorList"></tbody></table></div></section></div>
<script>
// PWA Install
let deferredPrompt; window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='inline-block'; });
document.getElementById('installBtn')?.addEventListener('click', async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').style.display='none'; }});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBOO3N0FFOIYj3QAwqM1HEIDlu9zZLLVHQ", authDomain: "xintimani-academy.firebaseapp.com", projectId: "xintimani-academy", storageBucket: "xintimani-academy.firebasestorage.app", messagingSenderId: "149830775344", appId: "1:149830775344:web:2758c500bc1bbd4099f3f5" };
const appFB = initializeApp(firebaseConfig); const db = getFirestore(appFB);
let books=[], learners=[], transactions=[], educators=[]; let currentUser=null;
try{ currentUser=JSON.parse(localStorage.getItem('xb_current_user')||'null'); }catch(e){ localStorage.clear(); }
document.getElementById('issueDate').valueAsDate=new Date(); let d=new Date(); d.setDate(d.getDate()+14); document.getElementById('dueDate').valueAsDate=d;
onSnapshot(collection(db,'educators'), s=>{ educators=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll(); });
if(currentUser) showApp();
window.clearAll=function(){ localStorage.clear(); location.href=location.pathname+'?clear=1'; }
window.forceLogin=function(){ currentUser={username:'coordinator',role:'coordinator'}; localStorage.setItem('xb_current_user',JSON.stringify(currentUser)); showApp(); }
window.doLogin=function(){ let u=document.getElementById('loginUser').value.trim(); let p=document.getElementById('loginPass').value.trim(); if(u.toLowerCase()==='coordinator' && p==='Xintimani2026'){ currentUser={username:'coordinator',role:'coordinator'}; localStorage.setItem('xb_current_user',JSON.stringify(currentUser)); showApp(); return; } let f=educators.find(x=>x.username===u && x.password===p); if(f){ currentUser={username:f.username,role:'educator',name:f.name}; localStorage.setItem('xb_current_user',JSON.stringify(currentUser)); showApp(); return; } document.getElementById('loginError').innerText='Invalid! Use EMERGENCY LOGIN'; }
window.doLogout=function(){ localStorage.removeItem('xb_current_user'); location.reload(); }
window.showApp=function(){ document.getElementById('loginPage').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('welcomeUser').innerText='Welcome '+currentUser.username; document.getElementById('roleInfo').innerText='Role: '+currentUser.role; startSync(); }
function startSync(){ onSnapshot(collection(db,'books'), s=>{books=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll(); document.getElementById('syncStatus').innerText='● Connected: '+books.length;}); onSnapshot(collection(db,'learners'), s=>{learners=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll();}); onSnapshot(collection(db,'transactions'), s=>{transactions=s.docs.map(d=>({fid:d.id,...d.data()})); renderAll();}); }
window.showTab=function(id,el){ document.querySelectorAll('section').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active')); if(el)el.classList.add('active'); renderAll(); }
window.addLearner=async function(){ let n=document.getElementById('lName').value; if(!n) return alert('Enter name'); await addDoc(collection(db,'learners'),{name:n,grade:document.getElementById('lGrade').value,adm:document.getElementById('lId').value}); document.getElementById('lName').value=''; }
window.addEducator=async function(){ let name=document.getElementById('eName').value.trim(); let user=document.getElementById('eUsername').value.trim(); let pass=document.getElementById('ePassword').value.trim(); if(!name||!user||!pass) return alert('Fill all'); await addDoc(collection(db,'educators'),{name:name,username:user,password:pass}); document.getElementById('eduMsg').innerText='✅ Added '+name+' | '+user+' / '+pass; }
window.issueBook=async function(){ let l=learners.find(x=>x.fid==document.getElementById('issueLearner').value); let copy=books.find(x=>x.fid==document.getElementById('issueCopy').value); if(!l||!copy) return alert('Select'); await updateDoc(doc(db,'books',copy.fid),{status:'ISSUED',learner:l.name,dueDate:document.getElementById('dueDate').value}); await addDoc(collection(db,'transactions'),{copyNo:copy.copyNo,title:copy.title,learner:l.name,issueDate:document.getElementById('issueDate').value,dueDate:document.getElementById('dueDate').value,status:'ISSUED',created:Date.now(),condition:copy.condition||'Good'}); }
window.returnBook=async function(tFid,copyNo){ let cond=prompt('Condition? Good/Damaged/Lost/Needs Repair','Good'); if(cond===null) return; let b=books.find(x=>x.copyNo==copyNo); if(b){ let ns=cond.toLowerCase()=='good'?'AVAILABLE':cond.toUpperCase(); await updateDoc(doc(db,'books',b.fid),{status:ns,condition:cond,learner:'',dueDate:''}); } await updateDoc(doc(db,'transactions',tFid),{status:'RETURNED',returnDate:new Date().toISOString().slice(0,10),condition:cond}); }
window.returnAll=async function(){ if(!confirm('Return ALL?')) return; let iss=transactions.filter(t=>t.status==='ISSUED'); for(let t of iss){ let b=books.find(x=>x.copyNo==t.copyNo); if(b) await updateDoc(doc(db,'books',b.fid),{status:'AVAILABLE',condition:'Good',learner:'',dueDate:''}); await updateDoc(doc(db,'transactions',t.fid),{status:'RETURNED',returnDate:new Date().toISOString().slice(0,10),condition:'Good'}); } }
window.updateCond=async function(fid,val){ let ns=val=='Good'?'AVAILABLE':val.toUpperCase(); await updateDoc(doc(db,'books',fid),{condition:val,status:ns}); }
window.renderAll=function(){ if(learners.length) document.getElementById('issueLearner').innerHTML=learners.map(l=>`<option value="${l.fid}">${l.name} - ${l.grade}</option>`).join(''); let titles=[...new Set(books.map(b=>b.title))]; if(titles.length) document.getElementById('issueBook').innerHTML=titles.map(t=>`<option value="${t}">${t}</option>`).join(''); let sel=document.getElementById('issueBook').value; let av=books.filter(b=>b.status==='AVAILABLE'&&(!sel||b.title==sel)); if(av.length) document.getElementById('issueCopy').innerHTML=av.slice(0,100).map(b=>`<option value="${b.fid}">${b.copyNo}</option>`).join(''); document.getElementById('bookList').innerHTML=books.slice(-150).map(b=>`<tr><td>${b.copyNo}</td><td>${b.title}</td><td>${b.status}</td><td>${b.learner||''}</td><td><select onchange="updateCond('${b.fid}',this.value)"><option ${b.condition=='Good'?'selected':''}>Good</option><option ${b.condition=='Damaged'?'selected':''}>Damaged</option><option ${b.condition=='Lost'?'selected':''}>Lost</option><option ${b.condition=='Needs Repair'?'selected':''}>Needs Repair</option></select></td></tr>`).join(''); document.getElementById('learnerList').innerHTML=learners.map(l=>`<tr><td>${l.name}</td><td>${l.grade}</td></tr>`).join(''); document.getElementById('educatorList').innerHTML=educators.map(e=>`<tr><td>${e.name}</td><td>${e.username}</td><td>${e.password}</td></tr>`).join(''); let q=(document.getElementById('searchReturn')?.value||'').toLowerCase(); let today=new Date().toISOString().slice(0,10); let iss=transactions.filter(t=>t.status==='ISSUED'&&(!q||t.copyNo.toLowerCase().includes(q)||t.learner.toLowerCase().includes(q))); document.getElementById('issuedList').innerHTML=iss.map(t=>{ let od=t.dueDate&&t.dueDate<today; return `<tr><td>${t.copyNo}</td><td>${t.learner}</td><td>${t.title}</td><td class="${od?'overdue':''}">${t.dueDate||''} ${od?'OVERDUE':''}</td><td><button style="background:#1a7a3a;color:#fff;border:none;padding:6px 10px;border-radius:6px" onclick="returnBook('${t.fid}','${t.copyNo}')">Return</button></td></tr>`}).join(''); document.getElementById('historyList').innerHTML=transactions.slice().sort((a,b)=>b.created-a.created).slice(0,200).map(t=>`<tr><td>${t.issueDate||''}</td><td>${t.copyNo}</td><td>${t.title}</td><td>${t.learner}</td><td>${t.status}</td><td>${t.condition||''}</td></tr>`).join(''); }
window.exportCSV=function(){ let csv="Date,CopyNo,Title,Learner,Status,Condition\n"+transactions.map(t=>`${t.issueDate||''},${t.copyNo},${t.title},${t.learner},${t.status},${t.condition||''}`).join("\n"); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='History.csv'; a.click(); }
</script></body></html>
